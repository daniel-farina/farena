<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --display: #1c1c1e;
    --num: #505050;
    --num-hover: #6b6b6b;
    --op: #ff9f0a;
    --op-hover: #ffb340;
    --fn: #d4d4d2;
    --fn-text: #1c1c1e;
    --fn-hover: #e6e6e6;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .calculator {
    width: 340px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .display {
    color: var(--text);
    text-align: right;
    padding: 24px 12px 16px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .history {
    font-size: 20px;
    color: #8e8e93;
    min-height: 26px;
    word-break: break-all;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current {
    font-size: 64px;
    font-weight: 300;
    line-height: 1.05;
    word-break: break-all;
    overflow: hidden;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 12px;
  }
  button {
    border: none;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    font-size: 28px;
    font-weight: 400;
    color: var(--text);
    background: var(--num);
    cursor: pointer;
    transition: background .15s, transform .05s;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button:hover { background: var(--num-hover); }
  button:active { transform: scale(0.94); }
  button.fn {
    background: var(--fn);
    color: var(--fn-text);
    font-size: 24px;
  }
  button.fn:hover { background: var(--fn-hover); }
  button.op {
    background: var(--op);
    font-size: 32px;
  }
  button.op:hover { background: var(--op-hover); }
  button.op.active {
    background: #fff;
    color: var(--op);
  }
  button.zero {
    grid-column: span 2;
    aspect-ratio: auto;
    border-radius: 999px;
    justify-content: flex-start;
    padding-left: 28px;
  }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="sign">+/−</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-action="decimal">.</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </div>

<script>
(function () {
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');

  let current = '0';      // string being entered / shown
  let previous = null;    // stored operand (number)
  let operator = null;    // pending operator
  let resetNext = false;  // next digit starts a fresh number

  const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  function format(n) {
    if (n === 'Error') return n;
    const num = Number(n);
    if (!isFinite(num)) return 'Error';
    // Limit precision to avoid floating-point noise, keep it readable.
    let str = Math.abs(num) < 1e-12 ? '0'
      : parseFloat(num.toPrecision(12)).toString();
    return str;
  }

  function render() {
    currentEl.textContent = current.length > 0 ? current : '0';
    if (operator && previous !== null) {
      historyEl.textContent = `${format(previous)} ${opSymbols[operator]}`;
    } else {
      historyEl.textContent = '';
    }
    highlightOp();
  }

  function highlightOp() {
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    if (operator && !resetNext === false) {
      const btn = document.querySelector(`.op[data-op="${operator}"]`);
      if (btn) btn.classList.add('active');
    }
  }

  function inputNumber(d) {
    if (resetNext) { current = d; resetNext = false; return; }
    if (current === '0') current = d;
    else current += d;
  }

  function inputDecimal() {
    if (resetNext) { current = '0.'; resetNext = false; return; }
    if (!current.includes('.')) current += '.';
  }

  function compute(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? 'Error' : a / b;
    }
  }

  function handleOperator(nextOp) {
    const inputVal = parseFloat(current);
    if (operator && !resetNext) {
      const result = compute(previous, inputVal, operator);
      if (result === 'Error') { showError(); return; }
      previous = parseFloat(format(result));
      current = format(result);
    } else {
      previous = inputVal;
    }
    operator = nextOp;
    resetNext = true;
  }

  function handleEquals() {
    if (operator === null || previous === null) return;
    const inputVal = parseFloat(current);
    const result = compute(previous, inputVal, operator);
    if (result === 'Error') { showError(); return; }
    historyEl.textContent = `${format(previous)} ${opSymbols[operator]} ${format(inputVal)} =`;
    current = format(result);
    previous = null;
    operator = null;
    resetNext = true;
    currentEl.textContent = current;
    highlightOp();
    return true;
  }

  function showError() {
    current = 'Error';
    previous = null;
    operator = null;
    resetNext = true;
    render();
    current = '0';
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    resetNext = false;
  }

  function toggleSign() {
    if (current === '0' || current === 'Error') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
  }

  function percent() {
    current = format(parseFloat(current) / 100);
    resetNext = true;
  }

  // Click handling
  document.querySelector('.keys').addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    const acClear = document.querySelector('[data-action="clear"]');

    if (t.dataset.num !== undefined) { inputNumber(t.dataset.num); acClear.textContent = 'C'; }
    else if (t.dataset.op) { handleOperator(t.dataset.op); }
    else {
      switch (t.dataset.action) {
        case 'equals': if (handleEquals()) { acClear.textContent = 'AC'; return; } break;
        case 'clear': clearAll(); acClear.textContent = 'AC'; break;
        case 'sign': toggleSign(); break;
        case 'percent': percent(); break;
        case 'decimal': inputDecimal(); acClear.textContent = 'C'; break;
      }
    }
    render();
  });

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k >= '0' && k <= '9') { inputNumber(k); }
    else if (k === '.') { inputDecimal(); }
    else if (['+', '-', '*', '/'].includes(k)) { handleOperator(k); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); handleEquals(); }
    else if (k === 'Escape') { clearAll(); }
    else if (k === 'Backspace') {
      if (!resetNext && current !== '0' && current !== 'Error') {
        current = current.length > 1 ? current.slice(0, -1) : '0';
      }
    }
    else if (k === '%') { percent(); }
    else return;
    render();
  });

  render();
})();
</script>
</body>
</html>
